<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Search — Messenger Better Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="search-shell">
  <div class="brand">
    <div class="brand-mark">M</div>
    <div class="brand-copy"><strong>Conversation archive</strong><span>Search your imported Meta history</span></div>
  </div>

  <section class="hero">
    <h1>Find the thing you remember, not the exact words.</h1>
    <p>Search your official Meta export locally. Filter by conversation and date, then expand day, week, month or year context.</p>
  </section>

  <section class="card" style="margin-top:18px">
    <div class="search-toolbar">
      <input id="query" aria-label="Search query" placeholder="e.g. soft flask stand, SMS code, trip in May…" />
      <input id="from" aria-label="Search from date" type="date" />
      <input id="to" aria-label="Search to date" type="date" />
      <button id="run" class="primary">Search</button>
    </div>
    <div class="row" style="margin-top:10px; flex-wrap:wrap">
      <select id="conversation" aria-label="Conversation" style="max-width:280px"></select>
      <select id="groupBy" aria-label="Group results by" style="max-width:180px">
        <option value="day">Group by day</option>
        <option value="week">Group by week</option>
        <option value="month">Group by month</option>
        <option value="year">Group by year</option>
      </select>
      <label class="pill"><input id="semantic" type="checkbox" style="width:auto"> semantic</label>
      <span id="count" class="muted"></span>
      <button id="export" class="secondary">Export JSON</button>
      <button id="importMore" class="secondary">Import newer history</button>
    </div>
  </section>

  <section id="timeline" class="timeline"></section>
</main>
<script type="module" src="search.js"></script>
</body>
</html>
