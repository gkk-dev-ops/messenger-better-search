<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Messenger Better Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <div class="brand">
      <img src="icons/icon48.png" width="34" height="34" alt="" />
      <div class="brand-copy">
        <strong>Messenger Better Search</strong>
        <span>local-first · open-source by GKD</span>
      </div>
    </div>

    <section class="card">
      <div class="row-between">
        <div>
          <div class="label">MESSAGES</div>
          <div class="metric" id="messageCount">—</div>
        </div>
        <div style="text-align:right">
          <div class="label">CONVERSATIONS</div>
          <div class="metric" id="conversationCount">—</div>
        </div>
      </div>
      <small id="lastImport" class="muted">Checking local archive…</small>
    </section>

    <section class="card stack">
      <strong id="onboardingTitle">Import your Messenger history</strong>
      <span id="onboardingCopy" class="muted">Use Meta Export Your Information JSON. No Messenger scraping or automated scrolling.</span>
      <button id="import" class="primary">Import Meta export</button>
      <button id="search" class="secondary">Search archive</button>
    </section>

    <div class="nav">
      <button id="settings" class="secondary">Settings</button>
      <a class="button secondary" href="https://gkd.agency" target="_blank" rel="noopener noreferrer">Project by GKD ↗</a>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
